name: Тесты

# Коммиты, которые сделал merge.yml, другие сценарии не запускают,
# поэтому кроме пушей в main есть еженедельная проверка.
on:
  push:
    branches: ['main']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt pytest

      - name: Проверка SKILL.md
        run: python -m pytest -q
